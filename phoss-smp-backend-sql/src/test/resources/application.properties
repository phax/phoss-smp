# SQL backend for testing this project
smp.backend = sql

## JDBC configuration for DB
# This matches the PostgreSQL instance of "unittest-db-docker-compose.yml"
jdbc.database-type = PostgreSQL
jdbc.driver = org.postgresql.Driver
jdbc.url = jdbc:postgresql://localhost:5432/postgres
jdbc.user = peppol
jdbc.password = peppol
jdbc.schema = smp
jdbc.read-connections.max = 10
smp.flyway.jdbc.schema-create = true
